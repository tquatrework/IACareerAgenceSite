# Fiches des offres (packs indépendants et familles PME), affichées sur /solutions/<slug>.
#
# Une entrée = une fiche. Modifiez les textes ; ne changez pas les noms de clés.
# - slug : adresse de la fiche (minuscules, chiffres, tirets) — ne pas la changer sans raison : les liens existants cesseraient de marcher.
# - audience : "independant" ou "pme" (détermine la page où l'offre est listée).
# - cards : numéros des cartes de solutions (1 à 30) liées à cette offre.
# - Les prix, délais et volumes ne sont pas établis : les fiches affichent « Sur devis ».

offers:
  - slug: site-presence-en-ligne
    audience: independant
    kind: Pack
    title: Site & présence en ligne
    summary: Site, prise de contact ou de rendez-vous, visibilité et mises à jour selon le périmètre.
    problem: Votre activité mérite un site clair, facile à tenir à jour et trouvable, sans budget ni maintenance disproportionnés.
    concerned: Indépendants et très petites structures sans site, ou avec un site vieillissant et difficile à modifier.
    receives:
      - Un site adapté à votre activité, réalisé avec l’aide de l’IA
      - Une prise de contact ou de rendez-vous
      - Une structure pensée pour la visibilité SEO/GEO
      - Une prise en main pour mettre vous-même à jour vos contenus
    tools:
      - Vos textes, visuels et références existants
      - Un nom de domaine (ou son acquisition à prévoir)
    inScope:
      - Création du site et de ses pages convenues
      - Formulaire de contact ou de rendez-vous
      - Structuration SEO/GEO de base
    adaptation:
      - Boutique en ligne
      - Fonctions d’IA intégrées au site (assistant, recherche)
      - Reprise d’un site existant
    validations:
      - Relecture et validation des contenus publiés
      - Exactitude des informations légales et commerciales
    cards:
      - 1
      - 2
      - 19
  - slug: messagerie-organisation
    audience: independant
    kind: Pack
    title: Messagerie & organisation
    summary: Tri des mails, préparation des réponses, synthèses de rendez-vous et suivi des actions.
    problem: Votre boîte mail déborde, les engagements pris en rendez-vous se perdent et vous portez tout dans votre tête.
    concerned: Indépendants qui gèrent seuls échanges, rendez-vous et suivi.
    receives:
      - Un classement des messages et le repérage des demandes importantes
      - Des brouillons de réponse que vous relisez avant envoi
      - Des notes de rendez-vous avec engagements et prochaines actions
      - Une liste d’actions à suivre
    tools:
      - Votre messagerie et votre agenda
      - Un outil de prise de notes de rendez-vous (aucun fournisseur n’est imposé)
    inScope:
      - Règles de tri et brouillons de réponse
      - Synthèse des échanges et actions
      - Gestion des disponibilités, confirmations et rappels
    adaptation:
      - Plusieurs boîtes ou plusieurs agendas
      - Réponses dans un ton ou un vocabulaire très spécifique
    validations:
      - Aucune réponse n’est envoyée sans votre relecture, sauf règle que vous aurez décidée
      - Choix des messages à traiter automatiquement
    cards:
      - 3
      - 4
      - 19
  - slug: relation-client
    audience: independant
    kind: Pack
    title: Relation client
    summary: CRM, notes clients, propositions commerciales et relances.
    problem: Les informations clients sont éparpillées, les relances oubliées et les devis longs à préparer.
    concerned: Indépendants et petites équipes qui suivent prospects et clients.
    receives:
      - "Un suivi clients à jour (CRM : outil de suivi de la relation client)"
      - Des synthèses d’échanges rattachées aux fiches
      - Des propositions préparées à partir de vos offres et tarifs validés
      - Des rappels de relances et d’échéances
    tools:
      - Vos fichiers de suivi ou votre CRM
      - Vos offres et tarifs à jour
    inScope:
      - Structuration du suivi clients
      - Préparation de devis et de propositions
      - Suivi des devis, factures et échéances
    adaptation:
      - Connexion à un CRM ou un logiciel de facturation existant
      - Qualification des demandes entrantes selon vos critères
    validations:
      - Validation de chaque devis avant envoi
      - Exactitude des tarifs et conditions
    cards:
      - 5
      - 6
      - 7
      - 8
  - slug: pilotage-activite
    audience: independant
    kind: Pack
    title: Pilotage de l’activité
    summary: Tableau de bord, indicateurs, synthèses et points d’attention.
    problem: Vos chiffres sont difficiles à suivre et vous manquez d’une vue simple de l’état de votre activité.
    concerned: Indépendants et petites structures disposant de tableurs ou de données de gestion dispersées.
    receives:
      - Un tableau de bord avec les indicateurs utiles
      - Une synthèse périodique et des points à examiner
      - Des rapports préparés à partir de vos données
    tools:
      - Vos tableurs ou outils de gestion
      - La définition des indicateurs qui comptent pour vous
    inScope:
      - Regroupement de sources convenues
      - Tableau de bord et rapports périodiques
    adaptation:
      - Sources nombreuses ou de qualité inégale
      - Indicateurs spécifiques à un métier
    validations:
      - Choix et définition des indicateurs
      - Contrôle de la cohérence des chiffres présentés
    cards:
      - 9
      - 10
  - slug: communication
    audience: independant
    kind: Pack
    title: Communication
    summary: Publications, newsletters et supports préparés à partir des références de l’activité.
    problem: Votre communication est irrégulière faute de temps, alors que vos références et votre savoir-faire sont bien réels.
    concerned: Indépendants et petites structures qui souhaitent communiquer régulièrement.
    receives:
      - Des publications et newsletters préparées à partir de vos références
      - "Des supports commerciaux cohérents : présentations, fiches, catalogues"
      - Un rythme de publication tenable
    tools:
      - Vos références, témoignages et informations validés
      - Votre charte graphique si elle existe
    inScope:
      - Préparation de contenus et supports convenus
      - Trame réutilisable
    adaptation:
      - Déclinaison sur plusieurs canaux
      - Création d’une identité visuelle
    validations:
      - Relecture et accord avant toute publication
      - Droit d’utiliser les références et visuels cités
    cards:
      - 11
      - 12
  - slug: documents-administratif
    audience: independant
    kind: Pack
    title: Documents & administratif
    summary: Classement, extraction d’informations, contrôle des pièces et recherche documentaire.
    problem: "L’administratif prend du temps : documents introuvables, informations recopiées à la main, pièces à vérifier."
    concerned: Indépendants et petites structures qui gèrent beaucoup de pièces et de dossiers.
    receives:
      - Un classement et un nommage cohérents des documents
      - L’extraction d’informations vers vos outils ou dossiers
      - Un contrôle de complétude selon vos règles
      - Une recherche dans vos documents
    tools:
      - Vos documents sous forme numérique
      - Vos règles de vérification, écrites ou à formaliser avec vous
    inScope:
      - Organisation des documents convenus
      - Extraction et contrôle sur des types de pièces définis
    adaptation:
      - Documents manuscrits ou de mauvaise qualité
      - Règles métier complexes
    validations:
      - Vérification des informations extraites avant usage
      - Décision finale sur les dossiers contrôlés
    cards:
      - 13
      - 14
      - 15
  - slug: applications-metier
    audience: pme
    kind: Famille
    title: Applications métier
    summary: Développement d’un outil adapté à un processus ou à une activité.
    problem: Un processus de l’entreprise repose sur des tableurs, des mails ou des habitudes, faute d’outil adapté.
    concerned: Équipes dont un processus précis mérite un outil à son image, y compris un portail pour clients ou partenaires.
    receives:
      - Un outil utilisable par les personnes concernées
      - Des droits d’accès définis par rôle
      - Une documentation et une prise en main
      - "Éventuellement un portail client (extranet : espace d’échange sécurisé)"
    tools:
      - La description du processus actuel
      - Les utilisateurs et leurs rôles
      - Les données à manipuler
    inScope:
      - Un périmètre fonctionnel explicite, validé avant réalisation
      - Tests sur des cas réels et des cas difficiles
    adaptation:
      - Connexions à des logiciels existants
      - Évolutions après usage
    validations:
      - Validation du périmètre et des règles de gestion
      - Recette de l’outil avec les utilisateurs
    cards:
      - 21
      - 22
  - slug: connexions-outils-internes
    audience: pme
    kind: Famille
    title: Connexions aux outils internes
    summary: Développement de connexions MCP ou API entre assistants, agents et logiciels d’entreprise.
    problem: "Vos assistants ne voient pas vos logiciels : chacun reste isolé et les informations sont recopiées."
    concerned: Entreprises utilisant plusieurs logiciels et souhaitant que des assistants IA y accèdent de manière contrôlée.
    receives:
      - Des connexions limitées aux fonctions autorisées
      - Une description claire de ce que l’assistant peut lire ou faire
      - Une journalisation des actions selon le projet
    tools:
      - Des logiciels dotés d’une API (interface de programmation) ou d’un accès documenté
      - Un responsable des droits d’accès
    inScope:
      - Connexion de logiciels convenus via API ou MCP (standard de connexion pour assistants IA)
      - Définition des droits et des actions autorisées
    adaptation:
      - Logiciels sans API
      - Actions sensibles nécessitant une validation humaine
    validations:
      - Liste des fonctions ouvertes à l’assistant
      - Actions soumises à validation humaine
    cards:
      - 23
  - slug: support-client-interne
    audience: pme
    kind: Famille
    title: Support client ou interne
    summary: Chatbot, réponses aux questions, qualification et transmission des cas nécessitant une personne.
    problem: Les mêmes questions reviennent sans cesse, auprès des clients comme des collaborateurs.
    concerned: Équipes de support, d’accueil, de ressources humaines ou toute équipe répondant à des demandes récurrentes.
    receives:
      - Un assistant qui répond aux demandes courantes
      - Une qualification des demandes
      - Une transmission à une personne quand c’est nécessaire
      - "Selon le canal : accueil téléphonique ou accompagnement des nouveaux collaborateurs"
    tools:
      - Vos réponses de référence et procédures
      - "Les canaux concernés : site, messagerie, téléphone"
    inScope:
      - Périmètre de questions défini avec vous
      - Règles de transmission vers une personne
    adaptation:
      - Canal téléphonique
      - Procédures internes sensibles
    validations:
      - Contenu des réponses de référence
      - Situations qui doivent toujours être transmises à une personne
    cards:
      - 17
      - 18
      - 26
  - slug: assistant-documentaire-rag
    audience: pme
    kind: Famille
    title: Assistant documentaire — RAG
    summary: Recherche dans un ensemble de documents et réponses sourcées.
    problem: "L’information existe mais personne ne la retrouve : documents nombreux, procédures dispersées, fiches produits difficiles à parcourir."
    concerned: "Équipes disposant d’un fonds documentaire : procédures, contrats-types, documentation technique, catalogues."
    receives:
      - Un assistant qui répond en citant les passages et documents utilisés
      - Un accès restreint aux utilisateurs autorisés
      - "Selon le besoin : veille ciblée ou recherche dans un catalogue de produits"
    tools:
      - Un ensemble de documents numériques
      - La liste des utilisateurs et leurs droits sur ces documents
    inScope:
      - Mise en place sur un corpus documentaire défini
      - Affichage des sources de chaque réponse
    adaptation:
      - Documents scannés ou très hétérogènes
      - Droits d’accès différenciés selon les documents
    validations:
      - Choix des documents indexés
      - Vérification des réponses sur des questions représentatives
    cards:
      - 16
      - 27
      - 28
  - slug: agent-equipe
    audience: pme
    kind: Famille
    title: Agent commun à une équipe
    summary: Instructions et ressources partagées, accès aux outils définis et actions encadrées.
    problem: Chacun utilise l’IA dans son coin, avec ses propres consignes et sans règle commune.
    concerned: Équipes qui souhaitent un assistant partagé, avec des consignes, des documents et des outils communs.
    receives:
      - Un agent configuré pour l’équipe
      - Des instructions et ressources partagées
      - Des actions encadrées et des responsabilités identifiées
    tools:
      - Les documents de référence de l’équipe
      - Les outils auxquels l’agent peut accéder
    inScope:
      - Définition des usages, des droits et des limites
      - Prise en main par l’équipe
    adaptation:
      - Accès à des outils internes
      - Plusieurs équipes aux besoins différents
    validations:
      - Actions soumises à validation humaine
      - Désignation d’un responsable de l’agent
    cards:
      - 20
  - slug: automatisation-processus
    audience: pme
    kind: Famille
    title: Automatisation des processus
    summary: Traitement des documents, circulation des données, préparation des actions et validations.
    problem: Les mêmes informations sont ressaisies d’un logiciel à l’autre et les validations se perdent.
    concerned: Équipes dont les processus passent par plusieurs outils et plusieurs personnes.
    receives:
      - Une circulation de l’information entre vos outils
      - Des actions préparées puis validées par la personne responsable
      - Une description du processus automatisé
    tools:
      - Les logiciels concernés
      - La description du processus actuel
    inScope:
      - Un processus délimité et ses points de validation
      - Gestion des erreurs et des exceptions identifiées
    adaptation:
      - Logiciels peu ouverts
      - Processus très variables selon les cas
    validations:
      - Étapes à valider par une personne
      - Cas d’exception à traiter à la main
    cards:
      - 24
  - slug: donnees-pilotage
    audience: pme
    kind: Famille
    title: Données et pilotage
    summary: Centralisation, fiabilisation, tableaux de bord et rapports.
    problem: Chaque service a ses chiffres, ils ne concordent pas et personne ne sait lesquels font foi.
    concerned: Directions et responsables qui pilotent à partir de plusieurs sources de données.
    receives:
      - Des sources rapprochées et des doublons traités
      - Des informations cohérentes d’un outil à l’autre
      - Des tableaux de bord et rapports
    tools:
      - Les sources de données concernées
      - Les définitions d’indicateurs partagées
    inScope:
      - Sources et indicateurs convenus
      - Règles de rapprochement explicites
    adaptation:
      - Sources de qualité inégale
      - Données sensibles soumises à des droits d’accès
    validations:
      - Source de référence en cas de désaccord
      - Définition des indicateurs
    cards:
      - 25
      - 9
      - 10
  - slug: reprise-outils-existants
    audience: pme
    kind: Famille
    title: Reprise d’outils existants
    summary: Amélioration, intégration ou sécurisation d’une application déjà utilisée.
    problem: Un outil en service, parfois réalisé avec l’aide de l’IA, devient fragile, peu documenté ou difficile à faire évoluer.
    concerned: Entreprises qui dépendent d’une application dont elles veulent améliorer la fiabilité et la sécurité.
    receives:
      - Un état des lieux de l’outil
      - Les corrections et améliorations convenues
      - Une documentation et une transmission
    tools:
      - L’accès au code source et à la documentation existante
      - Un interlocuteur connaissant l’usage de l’outil
    inScope:
      - Analyse de l’existant
      - Sécurisation et améliorations d’un périmètre défini
    adaptation:
      - Intégration à d’autres outils
      - Refonte partielle
    validations:
      - Périmètre des modifications
      - Recette avec les utilisateurs
    cards:
      - 29

