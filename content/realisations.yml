# Réalisations : liste (/realisations), fiche d'un projet (/realisations/<slug>) et bloc de l'accueil.
#
# Aucune réalisation n'est encore publiée : les quatre entrées sont des pistes de projets internes,
# présentées comme NON livrées. Ne les présentez comme livrées qu'une fois leur fiche documentée.

# Les quatre emplacements. slug = adresse de la fiche (minuscules, chiffres, tirets).
items:
  - slug: gestion-des-mails
    title: "Gestion des mails"
    theme: "Messagerie"
  - slug: suivi-commercial
    title: "Suivi commercial"
    theme: "Relation client"
  - slug: assistant-documentaire
    title: "Assistant documentaire"
    theme: "Documents"
  - slug: tableau-de-bord
    title: "Tableau de bord"
    theme: "Pilotage"

# Mentions communes à tous les emplacements tant qu'ils n'ont pas de fiche propre.
defaults:
  nature: "Projet interne IACareer"
  status: "Piste de projet — fiche à venir"
  summary: "Emplacement réservé à un outil conçu pour les besoins d’IACareer. Aucune réalisation n’est publiée à ce jour : la fiche sera renseignée lorsque le projet aura été mené et documenté."

# Rubriques que contiendra chaque fiche.
ficheSections:
  - "Nom et nature du projet"
  - "Contexte et besoin initial"
  - "Utilisateurs concernés"
  - "Ce qui a été réalisé"
  - "Outils et informations concernés"
  - "Captures ou présentation de l’outil réel"
  - "Place de l’IA et interventions humaines"
  - "Résultats observés, avec leur contexte"
  - "Limites et état d’avancement"

# Page « Réalisations » (/realisations)
listPage:
  meta:
    title: "Réalisations"
    description: "Les réalisations IACareer : emplacements réservés, projets internes et projets clients identifiés comme tels."
  head:
    eyebrow: "Réalisations"
    title: "Des projets documentés, avec leurs limites."
    lead: "Les quatre emplacements ci-dessous sont réservés. Aucune réalisation n’est encore publiée : nous ne présentons pas comme livré un projet qui ne l’est pas."
  note: "Les projets internes porteront la mention « Projet interne IACareer » ; les projets clients et les prototypes seront identifiés comme tels, avec leur état d’avancement."

# Fiche d'un projet (/realisations/<slug>)
detailPage:
  descriptionSuffix: "emplacement de réalisation en préparation."   # précédé du nom du projet
  leadSuffix: "Ce projet n’est pas présenté comme livré."           # précédé du statut du projet
  button: "Demander une réalisation comparable"
  sectionTitle: "Ce que contiendra la fiche"
  backLink: "Toutes les réalisations"
