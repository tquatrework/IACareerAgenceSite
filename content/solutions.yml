glossary:
  - term: "SEO / GEO"
    definition: "Être trouvé dans les moteurs de recherche (SEO) et cité par les moteurs d’IA (GEO)."
  - term: "CRM"
    definition: "Outil de suivi des clients et des prospects."
  - term: "RAG"
    definition: "Réponses élaborées à partir de vos documents, avec les sources."
  - term: "MCP / API"
    definition: "Moyens de connecter des assistants IA à vos logiciels."
